services:
  postgres:
    image: postgres:16
    container_name: codeweave-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codeweave
      POSTGRES_PASSWORD: codeweave_dev_pass
      POSTGRES_DB: codeweave
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: codeweave-redis
    restart: unless-stopped
    ports:
      - "6380:6379"

volumes:
  postgres_data: