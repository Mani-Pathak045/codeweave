# Judge0 Configuration
# https://github.com/judge0/judge0/blob/master/judge0.conf
#
# NOTE: These Judge0 services are kept in docker-compose.yml for reference but
# are no longer used by the CodeWeave backend. Code execution is now handled by
# the custom Docker-based executor in:
#   backend/src/modules/execution/execution.service.ts
#
# Background: Judge0 v1.13.1 bundles isolate v1.8.1 (built 2021) which crashes
# with SIGSEGV on WSL2 kernels ≥ 5.15 (Docker Desktop for Windows) due to a
# change in how pivot_root() behaves in new PID namespaces on modern kernels.
# This is unrelated to cgroup version or seccomp settings and cannot be fixed
# via configuration alone. The custom executor bypasses isolate entirely.

################################################################################
# Database settings
################################################################################
POSTGRES_HOST=judge0-postgres
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0pass

################################################################################
# Redis settings
################################################################################
REDIS_HOST=judge0-redis
REDIS_PORT=6379

################################################################################
# Server settings
################################################################################
AUTHN_HEADER=
AUTHN_TOKEN=
CPU_TIME_LIMIT=5
MAX_CPU_TIME_LIMIT=10
WALL_TIME_LIMIT=10
MAX_WALL_TIME_LIMIT=20
MEMORY_LIMIT=262144
MAX_MEMORY_LIMIT=512000
ENABLE_HTTPS=false
PORT=2358
